@if (isAuthenticationPage) {

  <!--
    Login e 2FA não utilizam o shell principal
    da aplicação.
  -->

  <router-outlet />

} @else {

  <!--
    Todas as páginas autenticadas utilizam o shell
    normal do ENG-APP.
  -->

  <div class="app-shell">

    <app-sidebar
      [appName]="appName"
      [appSubtitle]="appSubtitle"
    />

    <main class="content">

      <header class="content-header">
        <span>
          {{ currentSection }}
        </span>
      </header>

      <router-outlet />

    </main>

  </div>

}
