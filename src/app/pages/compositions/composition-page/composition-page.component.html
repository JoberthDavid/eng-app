@if (compositionTree) {

  @if (!isChildSelection) {

    <!-- ================================================= -->
    <!-- MODO NORMAL — COMPOSIÇÃO PRINCIPAL                -->
    <!-- ================================================= -->

    <div class="composition-page">


      @if (composition) {

        <!-- ============================================= -->
        <!-- RESUMO DA COMPOSIÇÃO                           -->
        <!-- ============================================= -->



        <!-- ============================================= -->
        <!-- COMPOSIÇÃO PRINCIPAL                           -->
        <!-- ============================================= -->

        <section class="root-composition-card">

          <div class="root-composition-title">

            <span>
              COMPOSIÇÃO PRINCIPAL
            </span>

          </div>


          <app-composition-panel
            [composition]="composition"
            [calculation]="calculation"
            [scrollable]="false"
          />

        </section>

      }

    </div>

  } @else {

    <!-- ================================================= -->
    <!-- MODO NAVEGAÇÃO — AX / TF                          -->
    <!-- ================================================= -->

    <div class="composition-workspace">

      <!-- =============================================== -->
      <!-- PAINEL SUPERIOR — COMPOSIÇÃO PAI                 -->
      <!-- =============================================== -->

      <section class="composition-panel">

        <header class="panel-title">

          <span>
            Composição principal
          </span>

        </header>


        <div class="panel-body">

          <app-composition-panel
            [composition]="parentNode?.composition ?? composition"
            [scrollable]="true"
          />

        </div>

      </section>


      <!-- =============================================== -->
      <!-- PAINEL INFERIOR — COMPOSIÇÃO SELECIONADA         -->
      <!-- =============================================== -->

      <section class="composition-panel">

        <header class="panel-title">

          <span>
            Composição selecionada
          </span>

        </header>


        <div class="panel-body">

          @if (childNode) {

          <app-composition-panel
            [composition]="childNode.composition"
            [scrollable]="true"
          />

          } @else {

            <div class="no-child">
              Nenhuma composição selecionada.
            </div>

          }

        </div>

      </section>

    </div>

  }

}
