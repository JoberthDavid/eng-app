<div class="sidebar">

  <div class="brand">
    <div class="brand-mark">E</div>

    <div>
      <strong>{{ appName }}</strong>
      <span>{{ appSubtitle }}</span>
    </div>
  </div>

  <nav class="navigation">

    <a
      routerLink="/projects"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"

    >
      <span>Projetos</span>
    </a>

    <a
      routerLink="/budgets"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"

    >
      <span>Orçamentos</span>
    </a>

  </nav>

  @if (compositionTree()) {
    <section class="composition-navigation">
      <span class="composition-navigation-title">
        Composição
      </span>

      <app-composition-tree
        [root]="compositionTree()"
        [selectedCode]="selectedCompositionCode"
        (compositionSelected)="onCompositionSelected($event)"
      />
    </section>
  }

  <div class="sidebar-footer">

    <!-- Usuário autenticado -->

    @if (currentUser$ | async; as user) {

      <div class="user-info">

        <span class="user-email">
          {{ user.email }}
        </span>

        <button
          type="button"
          class="logout-button"
          (click)="logout()"
        >
          Sair
        </button>

      </div>

    }

    <span class="version">
      v0.1
    </span>

  </div>

</div>
