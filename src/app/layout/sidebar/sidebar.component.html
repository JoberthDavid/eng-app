
<aside
  class="sidebar"
  [class.sidebar-open]="mobileOpen"
>
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">E</div>

    <div class="brand-copy">
      <strong>{{ appName }}</strong>
      <span>{{ appSubtitle }}</span>
    </div>
  </div>

  <nav class="navigation" aria-label="Navegação principal">
    <a
      routerLink="/projects"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="closeNavigation()"
    >
      <span>Projetos</span>
    </a>

    <a
      routerLink="/budgets"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="closeNavigation()"
    >
      <span>Orçamentos</span>
    </a>
  </nav>

  @if (compositionTree()) {
    <section class="composition-navigation">
      <span class="composition-navigation-title">
        Composição
      </span>

      <app-composition-tree
        [root]="compositionTree()"
        [selectedCode]="selectedCompositionCode"
        (compositionSelected)="onCompositionSelected($event)"
      />
    </section>
  }

  <footer class="sidebar-footer">
    @if (currentUser$ | async; as user) {
      <div class="user-info">
        <span class="user-email" [title]="user.email">
          {{ user.email }}
        </span>

        <button
          type="button"
          class="logout-button"
          (click)="logout()"
        >
          Sair
        </button>
      </div>
    }

    <span class="version">v0.1</span>
  </footer>
</aside>
